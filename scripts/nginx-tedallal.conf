# ==============================================================================
# إعداد Nginx الموصى به لمنصة تدلل لدعم النشر الذري بدون انقطاع
# المسار على السيرفر: /etc/nginx/sites-available/tedallal
# تفعيل الموقع: sudo ln -s /etc/nginx/sites-available/tedallal /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name tedallal.omarkhateeb.com;

    # تحويل تلقائي إلى HTTPS (إذا كان شهادة SSL مفعلة)
    # return 301 https://$host$request_uri;

    # توجيه الـ Root إلى الرابط الرمزي الحالي
    root /var/www/tedallal/current/public;
    index index.php index.html;

    charset utf-8;

    # أقصى حجم لرفع الوسائط وملفات القوائم
    client_max_body_size 50M;

    # ضغط Gzip لتسريع تصفح الواجهات وتوفير الباندويث
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # مسار WebSockets عبر Laravel Reverb
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_pass http://127.0.0.1:8080;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # التخزين المؤقت للأصول المبنية عبر Vite
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;

        # النقطة الجوهرية: استخدام $realpath_root لحل الرابط الرمزي فورياً وتفادي قفل OPcache
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # منع الوصول للملفات المخفية وملفات النظام الحساسة
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

