name: Deploy Tedallal Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup SSH and Run Deployment Engine
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          TARGET_HOST="${HOST:-194.163.44.154}"
          TARGET_USER="${USER:-deployer}"
          TARGET_PORT="${PORT:-22}"

          echo "Target Host: $TARGET_HOST"
          echo "Target User: $TARGET_USER"
          echo "Target Port: $TARGET_PORT"

          mkdir -p ~/.ssh
          python3 .github/scripts/format_key.py
          chmod 600 ~/.ssh/id_rsa
          cp ~/.ssh/id_rsa ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Update server to pull directly from public GitHub repo and run deployment engine
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_rsa -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "cd /var/www/tedallal && git remote set-url origin https://github.com/omar-khateeb-developer/Tedallal.git && git fetch origin main && git reset --hard origin/main && bash /var/www/tedallal/deploy.sh"

          # Verify deployed commit on server
          DEPLOY_INFO=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "cd /var/www/tedallal && git log -n 1 --oneline" | tr '\r\n' ' ')
          echo "::notice title=ServerCommit::$DEPLOY_INFO"
