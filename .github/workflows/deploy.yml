name: Deploy Tedallal Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Setup SSH and Run Deployment Engine
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          TARGET_HOST="${HOST:-194.163.44.154}"
          TARGET_USER="${USER:-deployer}"
          TARGET_PORT="${PORT:-22}"

          echo "Target Host: $TARGET_HOST"
          echo "Target User: $TARGET_USER"
          echo "Target Port: $TARGET_PORT"
          echo "Key length: ${#SSH_KEY}"

          if [ ${#SSH_KEY} -lt 50 ]; then
            echo "::error::VPS_SSH_KEY secret is missing or too short (length: ${#SSH_KEY}). Please ensure VPS_SSH_KEY contains the full private key."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "bash /var/www/tedallal/deploy.sh" 2>&1 | tee /tmp/deploy.log; then
            LAST_ERR=$(tail -n 15 /tmp/deploy.log | tr '\n' ' ')
            echo "::error::Deployment failed: $LAST_ERR"
            exit 1
          fi

          DIAG=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "cat /var/www/tedallal/deploy.sh; echo '=== RECENT LARAVEL LOG ==='; tail -n 25 /var/www/tedallal/current/storage/logs/laravel.log 2>/dev/null; tail -n 25 /var/www/tedallal/shared/storage/logs/laravel.log 2>/dev/null" 2>&1 | tr '\r\n' ' ')
          echo "::notice title=ServerDiagnostics::$DIAG"
