name: Deploy Tedallal Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify Build & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, gd, curl, zip
          coverage: none

      - name: 3. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci

      - name: 5. Typecheck, Static Analysis, Vite Build & Gateway Syntax
        run: |
          npx vue-tsc --noEmit
          php vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          npm run build
          node --check whatsapp-gateway/server.js

      - name: 6. Run Full PHPUnit Suite
        run: php artisan test

  deploy:
    name: Deploy to VPS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup SSH and Run Deployment Engine
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          TARGET_HOST="${HOST:-194.163.44.154}"
          TARGET_USER="${USER:-deployer}"
          TARGET_PORT="${PORT:-22}"

          echo "Target Host: $TARGET_HOST"
          echo "Target User: $TARGET_USER"
          echo "Target Port: $TARGET_PORT"

          mkdir -p ~/.ssh
          python3 .github/scripts/format_key.py
          chmod 600 ~/.ssh/id_rsa
          cp ~/.ssh/id_rsa ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Update server to pull directly from public GitHub repo and run deployment engine
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_rsa -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "cd /var/www/tedallal && git remote set-url origin https://github.com/omar-khateeb-developer/Tedallal.git && git fetch origin main && git reset --hard origin/main && bash /var/www/tedallal/deploy.sh"

          # Verify deployed commit on server
          DEPLOY_INFO=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "cd /var/www/tedallal && git log -n 1 --oneline" | tr '\r\n' ' ')
          echo "::notice title=ServerCommit::$DEPLOY_INFO"
