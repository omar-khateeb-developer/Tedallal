name: Deploy Tedallal Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Setup SSH and Run Deployment Engine
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          TARGET_HOST="${HOST:-194.163.44.154}"
          TARGET_USER="${USER:-deployer}"
          TARGET_PORT="${PORT:-22}"

          echo "Target Host: $TARGET_HOST"
          echo "Target User: $TARGET_USER"
          echo "Target Port: $TARGET_PORT"
          echo "Key length: ${#SSH_KEY}"

          if [ ${#SSH_KEY} -lt 50 ]; then
            echo "::error::VPS_SSH_KEY secret is missing or too short (length: ${#SSH_KEY}). Please ensure VPS_SSH_KEY contains the full private key."
            exit 1
          fi

          mkdir -p ~/.ssh
          python3 -c '
import os
raw = os.environ.get("SSH_KEY", "").strip()
if "\\n" in raw:
    raw = raw.replace("\\n", "\n")

lines = [l.strip() for l in raw.splitlines() if l.strip()]
if len(lines) <= 1:
    tokens = raw.split()
    h_end = -1
    e_start = -1
    for i, t in enumerate(tokens):
        if t.endswith("KEY-----"):
            if h_end == -1:
                h_end = i
        if t.startswith("-----END"):
            e_start = i
    if h_end != -1 and e_start != -1:
        header = " ".join(tokens[:h_end+1])
        footer = " ".join(tokens[e_start:])
        body = "".join(tokens[h_end+1:e_start])
        chunks = [body[j:j+64] for j in range(0, len(body), 64)]
        raw = header + "\n" + "\n".join(chunks) + "\n" + footer + "\n"

path = os.path.expanduser("~/.ssh/id_rsa")
with open(path, "w") as f:
    f.write(raw.strip() + "\n")
'
          chmod 600 ~/.ssh/id_rsa
          cp ~/.ssh/id_rsa ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          KEY_TEST=$(ssh-keygen -y -f ~/.ssh/id_rsa 2>&1 | head -n 1)
          echo "::notice title=KeyValidation::$KEY_TEST"

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_rsa -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "bash /var/www/tedallal/deploy.sh"
